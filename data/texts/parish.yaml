  - key: lit.litiya.hierarchy
    book: sluzhebnik
    kind: petition
    text: "Є҆щѐ мо́лимсѧ ѡ҆ вели́комъ господи́нѣ и҆ ѻ҆тцѣ̀ на́шемъ ст҃ѣ́йшемъ патрїа́рсѣ Кѵрі́ллѣ, и҆ ѡ҆ господи́нѣ на́шемъ преѡсвѧще́ннѣйшемъ митрополі́тѣ (и҆лѝ а҆рхїепⷭ҇кпѣ, и҆лѝ є҆пⷭ҇кпѣ) (и҆́мⷬ҇къ), и҆ ѡ҆ все́мъ во хрⷭ҇тѣ̀ бра́тствѣ на́шемъ, и҆ ѡ҆ всѧ́кой дꙋшѝ хрⷭ҇тїа́нстѣй, скорбѧ́щей же и҆ ѡ҆ѕло́бленнѣй, ми́лости бж҃їи и҆ по́мощи тре́бꙋющей: ѡ҆ защище́нїи гра́да сегѡ̀, и҆ живꙋ́щихъ въ не́мъ: ѡ҆ ми́рѣ и҆ ѹ҆строе́нїи всегѡ̀ мі́ра: ѡ҆ бл҃гостоѧ́нїи ст҃ы́хъ бж҃їихъ цр҃кве́й: ѡ҆ спасе́нїи и҆ по́мощи со тща́нїемъ и҆ стра́хомъ бж҃їимъ трꙋжда́ющихсѧ и҆ слꙋжа́щихъ ѻ҆тє́цъ и҆ бра́тїй на́шихъ: ѡ҆ ѡ҆ста́вльшихсѧ и҆ во ѿше́ствїи сꙋ́щихъ: ѡ҆ и҆сцѣле́нїи въ не́мощехъ лежа́щихъ: ѡ҆ ѹ҆спе́нїи, ѡ҆сла́бѣ, блаже́ннѣй па́мѧти и҆ ѡ҆ ѡ҆ставле́нїи грѣхѡ́въ всѣ́хъ преждеѿше́дшихъ ѻ҆тє́цъ и҆ бра́тїй на́шихъ, здѣ̀ лежа́щихъ и҆ повсю́дꙋ правосла́вныхъ: ѡ҆ и҆збавле́нїи плѣне́нныхъ, и҆ ѡ҆ бра́тїѧхъ на́шихъ во слꙋ́жбахъ сꙋ́щихъ, и҆ ѡ҆ всѣ́хъ слꙋжа́щихъ и҆ слꙋжи́вшихъ во ст҃ѣ́мъ хра́мѣ се́мъ, рце́мъ."
  - key: lit.litiya.city
