    kind: announcement
    hip: "Прокi'менъ, гла'съ и~:"
  - key: lit.alleluia.tone.1
    book: sluzhebnik
    kind: announcement
    hip: "А=ллилу'iа, гла'съ а~:"
  - key: lit.alleluia.tone.2
    book: sluzhebnik
    kind: announcement
    hip: "А=ллилу'iа, гла'съ в~:"
  - key: lit.alleluia.tone.3
