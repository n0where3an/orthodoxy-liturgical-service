    kind: announcement
    hip: "А=ллилу'iа, гла'съ и~:"
  - key: sl.kinonik.tue
    book: sluzhebnik
    kind: kinonik
    hip: "Въ па'мять вjь'чную бу'детъ пра'ведникъ, w\\т слу'ха зла` не о_у=бои'тся."

