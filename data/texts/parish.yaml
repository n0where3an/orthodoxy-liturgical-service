    text: "Є҆щѐ мо́лимсѧ ѡ҆ є҆́же сохрани́тисѧ гра́дꙋ семꙋ̀, и҆ ст҃о́мꙋ хра́мꙋ семꙋ̀, и҆ всѧ́комꙋ гра́дꙋ и҆ странѣ̀ ѿ гла́да, гꙋби́тельства, трꙋ́са, пото́па, ѻ҆гнѧ̀, меча̀, наше́ствїѧ и҆ноплеме́нникѡвъ и҆ междоꙋсо́бныѧ бра́ни: ѡ҆ є҆́же ми́лостивꙋ и҆ благоꙋвѣ́тливꙋ бы́ти бл҃го́мꙋ и҆ чл҃вѣколюби́вомꙋ бг҃ꙋ на́шемꙋ, ѿврати́ти всѧ́кїй гнѣ́въ на ны̀ дви́жимый, и҆ и҆зба́вити ны̀ ѿ належа́щагѡ и҆ пра́веднагѡ своегѡ̀ преще́нїѧ, и҆ поми́ловати ны̀."

