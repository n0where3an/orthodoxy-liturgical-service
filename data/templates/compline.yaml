  - {id: amen, ref: common.amen, performer: reader}

  - {id: prayer_undefiled, ref: ch.compline.prayer.undefiled, performer: reader}
  - {id: prayer_grant_us, ref: ch.compline.prayer.grant_us, performer: reader}
