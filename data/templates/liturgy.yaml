# Божественная литургия св. Иоанна Златоуста — по Служебнику (М., 1896)
# с поминовениями в нынешней приходской редакции; изобразительны — по
# Часослову. Проскомидия (совершается до начала литургии в алтаре) не
# включена. Ектении произносит диакон, а без него — священник
# (performer: litanist); диалоги священника с диаконом — только при диаконе.
#
# Литургия требует священника: параметр «без священника» к ней не применим.

