  - {id: lhm_1, ref: common.lord_have_mercy, performer: reader, repeat: 3}
  - {id: glory_now_2, ref: common.glory_now, performer: reader}
  - {id: psalm_24, ref: ch.gcompline.psalm.24, performer: reader}
  - {id: psalm_30, ref: ch.gcompline.psalm.30, performer: reader}
  - {id: psalm_90, ref: ch.sext.psalm.90, performer: reader}
  - {id: glory_now_3, ref: common.glory_now, performer: reader}
  - {id: alleluia_2, ref: common.alleluia_glory_to_thee, performer: reader, repeat: 3}
  - {id: lhm_2, ref: common.lord_have_mercy, performer: reader, repeat: 3}
