      - {id: amen_3, ref: common.amen, performer: reader}
      # В Великий пост — молитва св. Ефрема с поклонами.
      - id: lent_ephrem
        if_slot: lent
        children:
          - {id: ephrem_rubric, rubric: ephrem_prostrations, audience: kliros}
          - {id: ephrem_1, ref: ch.gcompline.ephrem.1, performer: reader}
          - {id: ephrem_2, ref: ch.gcompline.ephrem.2, performer: reader}
          - {id: ephrem_3, ref: ch.gcompline.ephrem.3, performer: reader}
          - {id: trisagion_4, include: trisagion_to_our_father}
          - {id: lhm_12, ref: common.lord_have_mercy, performer: reader, repeat: 12}
      - {id: prayer_undefiled, ref: ch.compline.prayer.undefiled, performer: reader}
