  - {id: intercession_5, ref: ch.gcompline.intercession.5, performer: choir, repeat: 2}
  - {id: intercession_6, ref: ch.gcompline.intercession.6, performer: choir, repeat: 2}
  - {id: cleanse_1, ref: ch.gcompline.cleanse.1, performer: choir, repeat: 2}
  - {id: cleanse_2, ref: ch.gcompline.cleanse.2, performer: choir, repeat: 2}
  - {id: trisagion_1, include: trisagion_to_our_father}
  - {id: troparia_1_rubric, rubric: compline_troparia, audience: kliros}
  - {id: troparia_1, slot: troparia_1, performer: reader}
  - {id: lhm_40_1, ref: common.lord_have_mercy, performer: reader, repeat: 40}
  - {id: glory_now_5, ref: common.glory_now, performer: reader}
  - {id: more_honorable_1, ref: common.more_honorable, performer: reader}
  - {id: in_the_name_1, ref: common.in_the_name_of_the_lord_bless, performer: reader, when: priest}
  - {id: holy_fathers_1, ref: common.prayers_of_holy_fathers, performer: priest, voice: aloud, when: priest}
  - {id: holy_fathers_1_reader, ref: common.prayers_of_holy_fathers, performer: reader, when: "!priest"}
  - {id: amen_1, ref: common.amen, performer: reader}
  - {id: prayer_basil, ref: ch.gcompline.prayer.basil, performer: reader}

  # --- Часть вторая ---
