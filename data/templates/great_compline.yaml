  - {id: with_us_god_v2, ref: ch.gcompline.with_us_god.verse.2, performer: choir}
  - {id: with_us_god_v3, ref: ch.gcompline.with_us_god.verse.3, performer: choir}
  - {id: with_us_god_v4, ref: ch.gcompline.with_us_god.verse.4, performer: choir}
  - {id: with_us_god_v5, ref: ch.gcompline.with_us_god.verse.5, performer: choir}
  - {id: with_us_god_v6, ref: ch.gcompline.with_us_god.verse.6, performer: choir}
  - {id: with_us_god_v7, ref: ch.gcompline.with_us_god.verse.7, performer: choir}
  - {id: with_us_god_v8, ref: ch.gcompline.with_us_god.verse.8, performer: choir}
  - {id: with_us_god_v9, ref: ch.gcompline.with_us_god.verse.9, performer: choir}
  - {id: with_us_god_v10, ref: ch.gcompline.with_us_god.verse.10, performer: choir}
  - {id: with_us_god_v11, ref: ch.gcompline.with_us_god.verse.11, performer: choir}
  - {id: with_us_god_v12, ref: ch.gcompline.with_us_god.verse.12, performer: choir}
  - {id: with_us_god_v13, ref: ch.gcompline.with_us_god.verse.13, performer: choir}
  - {id: with_us_god_v14, ref: ch.gcompline.with_us_god.verse.14, performer: choir}
  - {id: with_us_god_v15, ref: ch.gcompline.with_us_god.verse.15, performer: choir}
  - {id: with_us_god_v16, ref: ch.gcompline.with_us_god.verse.16, performer: choir}
  - {id: with_us_god_v17, ref: ch.gcompline.with_us_god.verse.17, performer: choir}
  - {id: with_us_god_v18, ref: ch.gcompline.with_us_god.verse.18, performer: choir}
  - {id: with_us_god_v19, ref: ch.gcompline.with_us_god.verse.19, performer: choir}
  - {id: with_us_god_again, ref: ch.gcompline.with_us_god, performer: choir}
  - {id: wug_glory, ref: common.glory, performer: choir}
  - {id: with_us_god_glory, ref: ch.gcompline.with_us_god, performer: choir}
  - {id: wug_and_now, ref: common.and_now, performer: choir}
  - {id: with_us_god_now, ref: ch.gcompline.with_us_god, performer: choir}
  - {id: with_us_god_end, ref: ch.gcompline.with_us_god.end, performer: choir}

  - {id: day_past_1, ref: ch.gcompline.day_past.1, performer: choir}
