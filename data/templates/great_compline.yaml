      - {id: prayer_most_glorious, ref: ch.compline.prayer.most_glorious, performer: reader}
      - {id: prayer_my_hope, ref: ch.compline.prayer.my_hope, performer: reader}
      - {id: end_glory_now, ref: common.glory_now, performer: reader}
