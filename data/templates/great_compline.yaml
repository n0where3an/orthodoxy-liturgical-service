# Повечерие великое — по Часослову (М., 1980). Служится вечером накануне дня.
#
# Первая часть: псалмы 4, 6, 12; 24, 30, 90; «С нами Бог» со стихами; «День
# прешед», «Безплотное естество», «Верую», «Пресвятая Владычице» и прочие
# моления, Трисвятое, тропари (troparia_1), «Господи, помилуй» 40, молитва
# «Господи, Господи, избавлей нас». Вторая: псалмы 50, 101, молитва Манассии,
# Трисвятое, тропари (troparia_2), молитва «Владыко Боже Отче
# Вседержителю». Третья: псалмы 69, 142, «Слава в вышних Богу» —
#   - в великие праздники (Рождество Христово, Богоявление, по Минее) лития в
#     притворе: стихиры литии, ектения литии (по Служебнику, как на вечерне),
#     стиховна, «Ныне отпущаеши», тропарь праздника
#     трижды (на Богоявление — благословение хлебов), «Буди имя Господне»,
#     псалом 33; далее утреня;
#   - иначе (Великий пост): «Сподоби, Господи», канон, «Господи сил» со
#     стихами, «Господи, аще не быхом», молитвы, молитва св. Ефрема с
#     поклонами, «Нескверная», «И даждь нам», прощение, ектения
#     «Помолимся о великом господине».

service: compline
nodes:
  - {id: title, ref: ch.gcompline.title, heading: true}
  # В праздник — начало с диаконом, «Благословен Бог наш» с каждением.
