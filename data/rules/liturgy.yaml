# Rules for the Divine Liturgy of St John Chrysostom.
#
# Implemented:
#   - a weekday (Monday..Saturday) of the ordinary period: typical antiphons,
#     troparia and kontakia of the day and of the saint, the prokeimenon,
#     alleluia, readings and communion verse of the day, with the saint's own
#     ones when the Menaion gives them;
#   - a saint with a sign (polyeleos, vigil) on a weekday: the same, with the
#     beatitudes from the Menaion's canon and the saint's troparion and
#     kontakion after the entrance;
#   - a fixed twelve feast (on any day; a feast of the Lord also on Sunday):
#     the festal antiphons (feasts of the Lord) or the beatitudes from the
#     canon, the entrance verse, the feast's troparion and kontakion, the
#     hymn instead of the Trisagion, the feast's prokeimenon, readings,
#     alleluia, zadostoinik and communion verse.
#
#   - a Sunday with readings of its own (before and after the Exaltation,
#     the Nativity — of the Fathers —, the Theophany): liturgy.sunday.special;
#   - an ordinary Sunday: the Octoechos (the beatitudes, the resurrectional
#     troparion and kontakion, the prokeimenon and alleluia of the tone), the
#     Sunday readings, «Хвалите Господа»; with a saint (with or without a
#     sign), a twelve feast of the Theotokos, or in an afterfeast.
#
#   - Saturday (Typikon, ch. 12, «Бог Господь»): the weekday rules with the
#     Saturday's hymns — «Апостоли, мученицы», the saint's troparion and
#     kontakion or «Помяни, Господи», «Со святыми упокой», «Яко начатки»;
#     the saint's prokeimenon, readings, alleluia and communion verse before
#     the day's;
#   - a weekday (Monday..Saturday) of the afterfeast of a fixed twelve feast,
#     or its apodosis: the feast's prokeimenon, alleluia, communion verse and
#     zadostoinik, the day's readings, the troparia by ch. 52;
#   - Dimitrievskaya Saturday (calendar: departed == "demetrius"): the same,
#     and after the day's «за упокой» (ch. 13): the prokeimenon «Души их»,
#     the Apostle (зач. 270), the Gospel (John, зач. 16), the alleluia verse
#     and the communion verse «Блажени, яже избрал».
#
# Recognised but not yet implemented: the Meatfare and the Trinity parental
# Saturdays (the Triodion), Saturday with «Аллилуиа» (ch. 13), the forefeast
# days, the Triodion, the eves of the Nativity and the Theophany, the
# Saturdays after the Nativity and the Theophany.
#
# The eve on Saturday or Sunday: St John Chrysostom's liturgy at its time —
# on Sunday the Sunday's (of the Fathers, before the Theophany:
# liturgy.sunday.special), on Saturday the day's with the readings of the
# Saturday before the feast first (litReadings) and the forefeast's hymns.
#
# The liturgy of St Basil the Great: the feasts of the Nativity and the
# Theophany on Sunday and Monday, 1 January (slot basil below).

- id: liturgy.annunciation_in_lent
  service: liturgy
  priority: 410
  when: feast == "annunciation" && period != "ordinary"
  unsupported: "Благовещение в дни Триоди (соединение с постной службой) ещё не реализовано"

- id: liturgy.lenten_weekday
  service: liturgy
  priority: 400
  when: period == "lenten-triodion" && pascha_offset >= -48 && pascha_offset <= -3 && weekday >= 1 && weekday <= 5
  unsupported: "В будни Великого поста полная литургия не совершается (Литургия Преждеосвященных Даров — в среду и пяток)"

- id: liturgy.nativity_theophany.eve
  service: liturgy
  priority: 352
  # The eve on a weekday: vespers joined to the liturgy of St Basil the Great
  # (internal/liturgy/eve_liturgy.go). The Great Blessing of Water after the
  # Theophany's (the Menaion, 6 January) is not done yet.
  when: eve != "" && weekday >= 1 && weekday <= 5
  slots:
    eve_vespers: {from: unit, refs: [sl.vespers.title]}
    eve_lord_i_call: {from: eve, part: lord_i_call}
    eve_prokeimenon: {from: eve, part: prokeimenon}
    eve_readings: {from: eve, part: readings}
    trisagion: {from: lit_trisagion}
    prokeimena: {from: eve, part: lit_prokeimena}
    apostles: {from: eve, part: lit_apostles}
    alleluia: {from: eve, part: lit_alleluia}
    gospels: {from: eve, part: lit_gospels}
    truly_meet: {from: unit, refs: [ch.lit.all_of_creation]}
    kinonik: {from: eve, part: kinonik}
    eve_after: {from: eve, part: after}

- id: liturgy.royal_hours_friday
  service: liturgy
  priority: 353
  # The Royal Hours moved to Friday (the feast on Sunday or Monday): the
  # typika end the hours, the liturgy is not served that day.
  when: royal_hours != "" && eve == ""
  unsupported: "В пятницу, когда на неё перенесены Царские часы, литургия не совершается: по 9-м часе изобразительны (-service typika)"

- id: liturgy.nativity_theophany
  service: liturgy
  priority: 350
  # The Nativity and the Theophany: the liturgy of St John Chrysostom (the
  # eve is a weekday, St Basil's is served on it), the feast's antiphons,
  # entrance verse, «Елицы во Христа» instead of the Trisagion, prokeimenon,
  # readings, alleluia, the zadostoinik («Любити убо нам», «Недоумеет всяк
  # язык» with their refrains), the communion verse.
  when: (month == 12 && day == 25) || (month == 1 && day == 6)
  slots: &feast_slots
    antiphon_1: {from: lit_antiphon, section: "1", part: feast}
    antiphon_2: {from: lit_antiphon, section: "2", part: feast}
    antiphon_3: {from: lit_antiphon, section: "3", part: feast}
    entrance: {from: lit_entrance, part: feast}
    troparia: {from: lit_troparia, part: feast}
    trisagion: {from: lit_trisagion, part: feast}
    prokeimena: {from: lit_prokeimena, part: feast}
    apostles: {from: lit_apostles, part: feast}
    alleluia: {from: lit_alleluia, part: feast}
    gospels: {from: lit_gospels, part: feast}
    truly_meet: {from: lit_truly_meet, part: feast}
    kinonik: {from: lit_kinonik, part: feast}

- id: liturgy.lord_feast_on_sunday
  service: liturgy
  priority: 320
  when: weekday == 0 && feast_day && feast in ["exaltation", "meeting", "transfiguration"] && menaion_paremias
  slots: *feast_slots

- id: liturgy.sunday.theotokos_feast
  service: liturgy
  priority: 315
  # A twelve feast of the Theotokos on Sunday: the Octoechos with the feast
  # (beatitudes 4 + 4, troparia, prokeimena, readings «дне и праздника»,
  # the feast's zadostoinik).
  when: >-
    weekday == 0 && feast_day && period == "ordinary" && menaion_paremias &&
    feast in ["nativity_of_theotokos", "entry_of_theotokos", "annunciation", "dormition"]
  slots:
    <<: &sunday_slots
      antiphon_1: {from: lit_antiphon, section: "1", part: sunday}
      antiphon_2: {from: lit_antiphon, section: "2", part: sunday}
      antiphon_3: {from: lit_antiphon, section: "3", part: sunday}
      entrance: {from: lit_entrance, part: sunday}
      troparia: {from: lit_troparia, part: sunday}
      trisagion: {from: lit_trisagion}
      prokeimena: {from: lit_prokeimena, part: sunday}
      apostles: {from: lit_apostles}
      alleluia: {from: lit_alleluia, part: sunday}
      gospels: {from: lit_gospels}
      truly_meet: {from: lit_truly_meet}
      kinonik: {from: lit_kinonik, part: sunday}
    troparia: {from: lit_troparia, part: sunday_feast}
    truly_meet: {from: lit_truly_meet, part: feast}

- id: liturgy.sunday.special
  service: liturgy
  priority: 306
  # A Sunday with readings of its own: before and after the Exaltation, of
  # the Fathers before the Nativity, after the Nativity, before and after the
  # Theophany (internal/liturgy/special_sunday.go). Not on the feast itself,
  # its eve (liturgy.nativity_theophany) or the Circumcision (the liturgy of
  # St Basil).
  when: >-
    weekday == 0 && period == "ordinary" && special_sunday != "" && !feast_day &&
    !(month == 1 && day == 1)
  slots:
    <<: *sunday_slots
    troparia: {from: lit_troparia, part: sunday_special}
    trisagion: {from: lit_trisagion, part: sunday_afterfeast}
    prokeimena: {from: lit_prokeimena, part: sunday_special}
    apostles: {from: lit_apostles, part: sunday_special}
    alleluia: {from: lit_alleluia, part: sunday_special}
    gospels: {from: lit_gospels, part: sunday_special}
    truly_meet: {from: lit_truly_meet, part: sunday_special}
    kinonik: {from: lit_kinonik, part: sunday_special}

- id: liturgy.sunday.afterfeast
  service: liturgy
  priority: 305
  # Sunday in the afterfeast (and on the apodosis) of a fixed twelve feast:
  # the Octoechos, the feast's troparion and kontakion, its zadostoinik.
  when: weekday == 0 && period == "ordinary" && feast != "" && !feast_day && !lections_omitted
  slots:
    <<: *sunday_slots
    troparia: {from: lit_troparia, part: sunday_afterfeast}
    trisagion: {from: lit_trisagion, part: sunday_afterfeast}
    truly_meet: {from: lit_truly_meet, part: sunday_afterfeast}

- id: liturgy.sunday
  service: liturgy
  priority: 300
  # An ordinary Sunday with a saint, without a sign or with one (then his
  # readings, prokeimenon, alleluia and communion verse follow the Sunday's).
  when: >-
    weekday == 0 && period == "ordinary" && feast == "" && !lections_omitted &&
    (!menaion_great_vespers || menaion_paremias)
  slots: *sunday_slots

- id: liturgy.sunday.unsupported
  service: liturgy
  priority: 299
  when: weekday == 0
  unsupported: "Воскресная литургия с праздником, попразднством, святым со знаком или в дни Триоди ещё не реализована"

- id: liturgy.feast
  service: liturgy
  priority: 295
  # A fixed twelve feast with its own service in the Menaion.
  when: feast_day && period == "ordinary" && menaion_paremias
  slots: *feast_slots

- id: liturgy.departed_triodion
  service: liturgy
  priority: 260
  when: departed in ["meatfare", "trinity"]
  unsupported: "Вселенская родительская суббота (мясопустная, Троицкая) — служба Триоди ещё не реализована"

- id: liturgy.triodion
  service: liturgy
  priority: 250
  when: period != "ordinary"
  unsupported: "Литургия в дни Триоди ещё не реализована"

- id: liturgy.afterfeast.weekday
  service: liturgy
  priority: 201
  # A weekday (Monday..Saturday) of the afterfeast, or the apodosis (the
  # Nativity's and the Theophany's too): internal/liturgy/afterfeast_liturgy.go. On Saturday the same («прокимен,
  # аллилуиа, и причастен праздника. апостол и еиглие прежде субботы…, таже
  # праздника»): not the Saturday's hymns, the Octoechos is not sung.
  when: >-
    feast != "" && !feast_day && weekday >= 1 && weekday <= 6 && !lections_omitted
  slots:
    antiphon_1: {from: lit_antiphon, section: "1", part: afterfeast}
    antiphon_2: {from: lit_antiphon, section: "2", part: afterfeast}
    antiphon_3: {from: lit_antiphon, section: "3", part: afterfeast}
    entrance: {from: lit_entrance, part: afterfeast}
    troparia: {from: lit_troparia, part: afterfeast}
    trisagion: {from: lit_trisagion, part: afterfeast}
    prokeimena: {from: lit_prokeimena, part: afterfeast}
    apostles: {from: lit_apostles, part: afterfeast}
    alleluia: {from: lit_alleluia, part: afterfeast}
    gospels: {from: lit_gospels, part: afterfeast}
    truly_meet: {from: lit_truly_meet, part: afterfeast}
    kinonik: {from: lit_kinonik, part: afterfeast}

- id: liturgy.afterfeast.nativity_theophany
  service: liturgy
  priority: 200
  # The Saturdays after the Nativity and the Theophany have readings of their
  # own (the Menaion, 12.26, 01.07): not done yet.
  when: feast in ["nativity", "theophany"]
  unsupported: "Суббота по Рождестве Христовом и по Богоявлении (свои чтения) ещё не реализована"

- id: liturgy.afterfeast
  service: liturgy
  priority: 199
  when: feast != ""
  unsupported: "Литургия праздника без своей службы в Минее и дней попразднства со своими чтениями ещё не реализована"

- id: liturgy.great_saint
  service: liturgy
  priority: 150
  # A saint with great vespers in the Menaion (polyeleos, vigil).
  when: menaion_paremias && !lections_omitted
  slots:
    antiphon_1: {from: lit_antiphon, section: "1", part: saint}
    antiphon_2: {from: lit_antiphon, section: "2", part: saint}
    antiphon_3: {from: lit_antiphon, section: "3", part: saint}
    entrance: {from: lit_entrance}
    troparia: {from: lit_troparia, part: saint}
    trisagion: {from: lit_trisagion}
    prokeimena: {from: lit_prokeimena}
    apostles: {from: lit_apostles}
    alleluia: {from: lit_alleluia}
    gospels: {from: lit_gospels}
    truly_meet: {from: lit_truly_meet}
    kinonik: {from: lit_kinonik}

- id: liturgy.great_saint_unsupported
  service: liturgy
  priority: 145
  when: menaion_great_vespers
  unsupported: "Литургия святому со знаком, чьи чтения в Минее не приведены, ещё не реализована"

- id: liturgy.no_readings
  service: liturgy
  priority: 140
  # (A Saturday before the Nativity or the Theophany reads its own: litReadings.)
  when: lections_omitted && special_sunday == ""
  unsupported: "В этот день рядовые чтения не положены (свои чтения дня) — ещё не реализовано"

- id: liturgy.weekday
  service: liturgy
  priority: 10
  slots:
    antiphon_1: {from: lit_antiphon, section: "1"}
    antiphon_2: {from: lit_antiphon, section: "2"}
    antiphon_3: {from: lit_antiphon, section: "3"}
    entrance: {from: lit_entrance}
    troparia: {from: lit_troparia}
    trisagion: {from: lit_trisagion}
    prokeimena: {from: lit_prokeimena}
    apostles: {from: lit_apostles}
    alleluia: {from: lit_alleluia}
    gospels: {from: lit_gospels}
    truly_meet: {from: lit_truly_meet}
    kinonik: {from: lit_kinonik}

# --- The beginning of the dismissal of the feasts of the Lord ---
- {id: liturgy.dismissal_prefix.meeting, slot: dismissal_prefix, service: liturgy, priority: 50, when: feast == "meeting", fill: {from: unit, refs: [sl.dismissal.prefix.meeting]}}
- {id: liturgy.dismissal_prefix.nativity, slot: dismissal_prefix, service: liturgy, priority: 50, when: feast == "nativity", fill: {from: unit, refs: [sl.dismissal.prefix.nativity]}}
- {id: liturgy.dismissal_prefix.theophany, slot: dismissal_prefix, service: liturgy, priority: 50, when: feast == "theophany", fill: {from: unit, refs: [sl.dismissal.prefix.theophany]}}
- {id: liturgy.dismissal_prefix.transfiguration, slot: dismissal_prefix, service: liturgy, priority: 50, when: feast == "transfiguration", fill: {from: unit, refs: [sl.dismissal.prefix.transfiguration]}}
# On Sunday «Воскресый из мертвых» (with a feast of the Lord on Sunday only the feast's).
- {id: liturgy.dismissal_prefix.sunday, slot: dismissal_prefix, service: liturgy, priority: 60, when: "weekday == 0 && !(feast_day && feast in ['exaltation', 'meeting', 'transfiguration'])", fill: {from: unit, refs: [sl.dismissal.prefix.sunday]}}
# --- The liturgy of St Basil the Great (slot basil: the template's «basil»):
# «аще навечерие… будет в субботу, и неделю… а на самый праздник литургиа
# поется василиева непременно. такожде бывает и в праздник просвещения»
# (Минея, 25 декабря); 1 января, в память свт. Василия; the eves on a
# weekday (with vespers). Not yet: the Sundays of Great Lent, Great Thursday
# and Saturday (the Triodion).
- {id: liturgy.basil, slot: basil, service: liturgy, priority: 50, when: "(month == 1 && day == 1) || eve != '' && weekday >= 1 && weekday <= 5 || ((month == 12 && day == 25) || (month == 1 && day == 6)) && (weekday == 0 || weekday == 1)", fill: {from: unit, refs: [sl.litb.title]}}
- {id: liturgy.eve_water, slot: eve_water, service: liturgy, priority: 50, when: "eve == 'theophany' && weekday >= 1 && weekday <= 5", fill: {from: unit, refs: [sl.vespers.title]}}
- {id: liturgy.eve_water.none, slot: eve_water, service: liturgy, priority: 10, when: "true", fill: {from: none}}
- {id: liturgy.basil.none, slot: basil, service: liturgy, priority: 10, when: "true", fill: {from: none}}

- {id: liturgy.dismissal_prefix.none, slot: dismissal_prefix, service: liturgy, priority: 10, when: "true", fill: {from: none}}
