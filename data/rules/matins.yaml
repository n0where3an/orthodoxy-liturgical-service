    sedalny_1: {from: sm_sedalny, section: "1"}
    sedalny_2: {from: sm_sedalny, section: "2"}
    sedalny_3: {from: none}
    magnification: {from: gm_magnification}
    evlogitaria: {from: sm_evlogitaria}
    hypakoe: {from: sm_hypakoe}
    sedalny_p: {from: gm_sedalny, section: "p"}
    stepenna: {from: sm_stepenna}
    prokeimenon: {from: sm_prokeimenon}
    gospel: {from: sm_gospel}
    after_gospel: {from: sm_after_gospel}
    ps50: {from: sm_ps50}
    canon_1_3: {from: sm_canon, section: "1-3", part: feast}
    sedalen: {from: sm_sedalen, part: feast}
    canon_4_6: {from: sm_canon, section: "4-6", part: feast}
    kontakion: {from: sm_kontakion, part: feast}
    canon_7_8: {from: sm_canon, section: "7-8", part: feast}
    magnificat: {from: none}
    canon_9: {from: sm_canon, section: "9", part: feast}
    exapostilaria: {from: sm_exapostilaria, part: feast}
    praises: {from: sm_praises, part: feast}
    end_troparia: {from: sm_end_troparion}
    plain_beginning: {from: none}

