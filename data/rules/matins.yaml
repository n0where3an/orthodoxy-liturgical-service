# --- Saturday with a saint with a sign (Типикон, гл. 11): the saint's order
# on kathismata 16 and 17; the canon of the Theotokos of the past Sunday on
# 6 and the saint's on 8 instead of the Octoechos's (matinsCanon). Not in a
# forefeast or afterfeast (the canon of the feast instead).

- id: matins.saturday.vigil
  service: matins
  priority: 294
  when: >-
    weekday == 6 && period == "ordinary" && feast == "" && !feast_period && departed == "" &&
    menaion_great_doxology && menaion_litiya && menaion_paremias
  template: great_matins
  slots: *saint_slots

- id: matins.saturday.polyeleos
  service: matins
  priority: 293
  when: >-
    weekday == 6 && period == "ordinary" && feast == "" && !feast_period && departed == "" &&
    menaion_great_doxology && menaion_paremias
  template: great_matins
  slots:
    <<: *saint_slots
    plain_beginning: {from: unit, refs: [sl.exclamation.blessed_is_our_god]}

- id: matins.saturday.doxology
  service: matins
  priority: 292
  # «В куюлибо субботу славословие прилучится»: daily matins with the great
  # doxology; the Menaion's sessional hymns after the kathismata where it
  # gives them, the saint's stichera at the praises, no aposticha.
  when: >-
    weekday == 6 && period == "ordinary" && feast == "" && !feast_period && departed == "" &&
    menaion_great_doxology && !menaion_great_vespers && !menaion_paremias && menaion_troparia > 0
  slots:
    troparia: {from: matins_troparia}
    sedalny_1: {from: gm_sedalny, section: "1"}
    sedalny_2: {from: gm_sedalny, section: "2"}
    canon_1_3: {from: matins_canon, section: "1-3"}
    sedalen: {from: matins_sedalen}
    canon_4_6: {from: matins_canon, section: "4-6"}
    kontakion: {from: matins_kontakion}
    canon_7_8: {from: matins_canon, section: "7-8"}
    canon_9: {from: matins_canon, section: "9"}
    exapostilaria: {from: matins_exapostilaria}
    praises: {from: gm_praises}
    aposticha: {from: none}
    end_troparia: {from: vespers_troparia}

- id: matins.great_saint
  service: matins
  priority: 150
  when: menaion_great_vespers
  unsupported: "Утреня святому со знаком, чья служба в Минее неполна, ещё не реализована"

