    gospel: {from: sm_gospel}
    after_gospel: {from: sm_after_gospel}
    ps50: {from: sm_ps50}
    canon_1_3: {from: sm_canon, section: "1-3", part: afterfeast}
    sedalen: {from: sm_sedalen, part: afterfeast}
    canon_4_6: {from: sm_canon, section: "4-6", part: afterfeast}
    kontakion: {from: sm_kontakion, part: afterfeast}
