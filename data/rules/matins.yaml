# Rules for matins. Implemented: daily (weekday) matins, Monday..Friday of
# the ordinary period, for a Menaion saint without a sign: sessional hymns,
# canons and aposticha of the Octoechos, the Menaion canon, sessional hymn,
# kontakion with ikos and exapostilarion.
#
# Also: a weekday of the afterfeast (matins.afterfeast).
#
# Also: Saturday (matins.saturday*).
#
# Also: a weekday apodosis (matins.apodosis.weekday).
#
# Recognised but not yet implemented: the apodosis on Saturday, the Triodion
# periods (Lenten matins with «Аллилуиа», Paschal matins).

- id: matins.lord_feast_on_sunday
  service: matins
  priority: 320
  when: weekday == 0 && feast_day && feast in ["exaltation", "meeting", "transfiguration"] && menaion_paremias
  template: great_matins
  slots: &feast_slots
    troparia: {from: gm_troparia, part: feast}
    sedalny_1: {from: gm_sedalny, section: "1"}
    sedalny_2: {from: gm_sedalny, section: "2"}
    sedalny_3: {from: gm_sedalny, section: "3"}
    sedalny_p: {from: gm_sedalny, section: "p"}
    magnification: {from: gm_magnification}
    prokeimenon: {from: gm_prokeimenon}
    gospel: {from: gm_gospel}
    ps50: {from: gm_ps50}
    canon_1_3: {from: gm_canon, section: "1-3", part: feast}
    sedalen: {from: gm_sedalen}
    canon_4_6: {from: gm_canon, section: "4-6", part: feast}
    kontakion: {from: matins_kontakion}
    canon_7_8: {from: gm_canon, section: "7-8", part: feast}
    magnificat: {from: none}
    canon_9: {from: gm_canon, section: "9", part: feast}
    exapostilaria: {from: gm_exapostilaria, part: feast}
    praises: {from: gm_praises}
    end_troparia: {from: gm_end_troparia, part: feast}
    plain_beginning: {from: none}

# --- Sunday matins (the vigil after Sunday vespers): the Octoechos with the
# Menaion (sm_*). See internal/liturgy/sunday_matins.go for the order.

- id: matins.sunday.theotokos_feast
