- id: matins.sunday.unsupported
  service: matins
  priority: 299
  when: weekday == 0
  unsupported: "Воскресная утреня в дни Триоди, с Рождеством или Богоявлением, со святым со знаком без чтений ещё не реализована"

- id: matins.nativity_theophany
  service: matins
  priority: 296
  when: (month == 12 && day == 25) || (month == 1 && day == 6)
  template: great_matins
  slots: *feast_slots

- id: matins.feast
  service: matins
  priority: 295
  # A fixed twelve feast: matins of the vigil, from the Menaion.
  when: feast_day && period == "ordinary" && menaion_paremias
  template: great_matins
  slots: *feast_slots

- id: matins.saturday
  service: matins
  priority: 291
  # Saturday with «Бог Господь» (Типикон, гл. 12): a saint of the Menaion
  # with a troparion, without a sign (internal/liturgy/saturday_matins.go).
  when: >-
    weekday == 6 && period == "ordinary" && feast == "" && departed == "" &&
    !menaion_great_vespers && !menaion_great_doxology && menaion_troparia > 0
  slots:
    troparia: {from: matins_troparia}
    sedalny_1: {from: sat_sedalny}
    sedalny_2: {from: matins_sedalny, section: "2"}
    canon_1_3: {from: matins_canon, section: "1-3"}
    sedalen: {from: matins_sedalen}
    canon_4_6: {from: matins_canon, section: "4-6"}
    kontakion: {from: matins_kontakion}
    canon_7_8: {from: matins_canon, section: "7-8"}
    canon_9: {from: matins_canon, section: "9"}
    exapostilaria: {from: matins_exapostilaria}
    praises: {from: gm_praises}
    aposticha: {from: sat_aposticha}
    end_troparia: {from: vespers_troparia}

- id: matins.saturday.unsupported
  service: matins
  priority: 290
  when: weekday == 6
  unsupported: "Субботняя утреня с «Аллилуиа», родительская, в предпразднство и попразднство, со святым со знаком без паремий в Минее ещё не реализована"

- id: matins.triodion
  service: matins
  priority: 250
  when: period != "ordinary"
  unsupported: "Утреня в дни Триоди (в Великий пост — «Аллилуиа», трипеснцы) ещё не реализована"

- id: matins.apodosis.weekday
  service: matins
  priority: 207
  # «Вся служба праздника» without the polyeleos and the Gospel
  # (internal/liturgy/apodosis_matins.go). Not where the Menaion of the
  # apodosis gives its own matins (11.25, with the saints: «канон праздника
  # со ирмосом на з, и стых оба канона на и») — matins.apodosis.menaion.
  when: feast != "" && apodosis && weekday >= 1 && weekday <= 5 && !menaion_exapostilaria
  template: great_matins
  slots:
    troparia: {from: ap_troparia}
    sedalny_1: {from: ap_sedalny, section: "1"}
    sedalny_2: {from: ap_sedalny, section: "2"}
    sedalny_3: {from: ap_sedalny, section: "3"}
    sedalny_p: {from: none}
    magnification: {from: none}
    prokeimenon: {from: none}
    gospel: {from: none}
    ps50: {from: ap_ps50}
    canon_1_3: {from: ap_canon, section: "1-3"}
    sedalen: {from: ap_sedalen}
    canon_4_6: {from: ap_canon, section: "4-6"}
    kontakion: {from: af_kontakion}
    canon_7_8: {from: ap_canon, section: "7-8"}
    magnificat: {from: none}
    canon_9: {from: ap_canon, section: "9"}
    exapostilaria: {from: ap_exapostilaria}
    praises: {from: ap_praises}
    end_troparia: {from: ap_end_troparia}
    plain_beginning: {from: unit, refs: [sl.exclamation.blessed_is_our_god]}

- id: matins.apodosis
  service: matins
  priority: 205
  when: feast != "" && apodosis
  unsupported: "Утреня на отдание праздника (поется вся служба праздника) ещё не реализована"

- id: matins.afterfeast.saint_unsupported
  service: matins
  priority: 202
  # A polyeleos or vigil in the afterfeast (great vespers with the entrance
  # alone — 09.15, 08.07 — is not a sign at matins: the afterfeast's order).
  when: feast != "" && !feast_day && menaion_paremias
  unsupported: "Утреня попразднства со святым со знаком (полиелей, бдение) ещё не реализована"

- id: matins.afterfeast
  service: matins
  priority: 201
  # A weekday of the afterfeast: the Menaion's own order (internal/liturgy/afterfeast_matins.go).
  when: feast != "" && !feast_day
  slots:
    troparia: {from: af_troparia}
    sedalny_1: {from: af_sedalny, section: "1"}
    sedalny_2: {from: af_sedalny, section: "2"}
    canon_1_3: {from: af_canon, section: "1-3"}
    sedalen: {from: af_sedalen}
    canon_4_6: {from: af_canon, section: "4-6"}
    kontakion: {from: af_kontakion}
    canon_7_8: {from: af_canon, section: "7-8"}
    canon_9: {from: af_canon, section: "9"}
    exapostilaria: {from: af_exapostilaria}
    praises: {from: gm_praises}
    aposticha: {from: matins_aposticha}
    end_troparia: {from: vespers_troparia}

- id: matins.apodosis.menaion
  service: matins
  priority: 206
  # The apodosis with the Menaion's own matins (11.25): the day's hymns as
  # in the afterfeast, without the polyeleos and the Gospel, the 9th ode
  # with the feast's refrains, the praises, the great doxology.
  when: feast != "" && apodosis && weekday >= 1 && weekday <= 5 && menaion_exapostilaria && !menaion_great_vespers
  template: great_matins
  slots:
    troparia: {from: af_troparia}
    sedalny_1: {from: af_sedalny, section: "1"}
    sedalny_2: {from: af_sedalny, section: "2"}
    sedalny_3: {from: af_sedalny, section: "3"}
    sedalny_p: {from: none}
    magnification: {from: none}
    prokeimenon: {from: none}
    gospel: {from: none}
    ps50: {from: ap_ps50}
    canon_1_3: {from: ap_canon, section: "1-3", part: menaion}
    sedalen: {from: ap_sedalen, part: menaion}
    canon_4_6: {from: ap_canon, section: "4-6", part: menaion}
    kontakion: {from: ap_kontakion}
    canon_7_8: {from: ap_canon, section: "7-8", part: menaion}
    magnificat: {from: none}
    canon_9: {from: ap_canon, section: "9", part: menaion}
    exapostilaria: {from: af_exapostilaria}
    praises: {from: gm_praises}
    end_troparia: {from: vespers_troparia}
    plain_beginning: {from: unit, refs: [sl.exclamation.blessed_is_our_god]}

- id: matins.synaxis_theotokos
  service: matins
  priority: 204
  # 26 December on a weekday (the Menaion): the service of the Nativity —
  # «тропарь праздника трижды… каноны праздника… тропари на ви… по г-й
  # песни кондак праздника и икос, и ипакои. по з-й песни кондак (иже прежде
  # денницы) и икос… на ф-й песни… припевы, якоже на самый праздник. светилен
  # трижды. на хвалитех стихиры на д… славословие великое»; the sessional
  # hymns and the praises the day's.
  when: feast == "nativity" && month == 12 && day == 26 && weekday >= 1 && weekday <= 5
  template: great_matins
  slots:
    troparia: {from: ap_troparia}
    sedalny_1: {from: af_sedalny, section: "1"}
    sedalny_2: {from: af_sedalny, section: "2"}
    sedalny_3: {from: af_sedalny, section: "3"}
    sedalny_p: {from: none}
    magnification: {from: none}
    prokeimenon: {from: none}
    gospel: {from: none}
    ps50: {from: ap_ps50}
    canon_1_3: {from: ap_canon, section: "1-3"}
    sedalen: {from: ap_sedalen, part: feast_kontakion}
    canon_4_6: {from: ap_canon, section: "4-6"}
    kontakion: {from: ap_kontakion, part: day}
    canon_7_8: {from: ap_canon, section: "7-8"}
    magnificat: {from: none}
    canon_9: {from: ap_canon, section: "9"}
    exapostilaria: {from: ap_exapostilaria, part: thrice}
    praises: {from: gm_praises}
    end_troparia: {from: ap_end_troparia}
    plain_beginning: {from: unit, refs: [sl.exclamation.blessed_is_our_god]}

- id: matins.afterfeast.doxology
  service: matins
  priority: 203
  # A weekday of the afterfeast with the great doxology (the Menaion's own
  # praises, no polyeleos): the day's hymns as in the afterfeast, without the
  # aposticha — the praises and the great doxology; at the 9th ode the
  # feast's refrains where the Menaion has them (12.26, 01.07: «якоже на
  # самый праздник»), else «Честнейшую».
  when: >-
    feast != "" && !feast_day && !apodosis && weekday >= 1 && weekday <= 5 &&
    menaion_praises && !menaion_paremias
  template: great_matins
  slots:
    troparia: {from: af_troparia}
    sedalny_1: {from: af_sedalny, section: "1"}
    sedalny_2: {from: af_sedalny, section: "2"}
    sedalny_3: {from: af_sedalny, section: "3"}
    sedalny_p: {from: none}
    magnification: {from: none}
    prokeimenon: {from: none}
    gospel: {from: none}
    ps50: {from: ap_ps50}
    canon_1_3: {from: ap_canon, section: "1-3", part: menaion}
    sedalen: {from: ap_sedalen, part: menaion}
    canon_4_6: {from: ap_canon, section: "4-6", part: menaion}
    kontakion: {from: ap_kontakion}
    canon_7_8: {from: ap_canon, section: "7-8", part: menaion}
    magnificat: {from: ap_magnificat}
    canon_9: {from: ap_canon, section: "9", part: menaion}
    exapostilaria: {from: af_exapostilaria}
    praises: {from: gm_praises}
    end_troparia: {from: vespers_troparia}
    plain_beginning: {from: unit, refs: [sl.exclamation.blessed_is_our_god]}

- id: matins.afterfeast.unsupported
  service: matins
  priority: 200
  when: feast != ""
  unsupported: "Утреня праздника без своей службы в Минее ещё не реализована"

- id: matins.vigil
  service: matins
  priority: 160
  # A saint with a vigil: matins begins with the Six Psalms after vespers.
  when: menaion_litiya && menaion_paremias
  template: great_matins
  slots: &saint_slots
    troparia: {from: gm_troparia}
    sedalny_1: {from: gm_sedalny, section: "1"}
    sedalny_2: {from: gm_sedalny, section: "2"}
    sedalny_3: {from: gm_sedalny, section: "3"}
    sedalny_p: {from: gm_sedalny, section: "p"}
    magnification: {from: gm_magnification}
    prokeimenon: {from: gm_prokeimenon}
    gospel: {from: gm_gospel}
    ps50: {from: gm_ps50}
    canon_1_3: {from: gm_canon, section: "1-3"}
    sedalen: {from: gm_sedalen}
    canon_4_6: {from: gm_canon, section: "4-6"}
    kontakion: {from: matins_kontakion}
    canon_7_8: {from: gm_canon, section: "7-8"}
    magnificat: {from: unit, refs: [ch.matins.magnificat.1]}
    canon_9: {from: gm_canon, section: "9"}
