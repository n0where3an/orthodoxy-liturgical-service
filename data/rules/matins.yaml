- id: matins.triodion.lent_sunday
  service: matins
  priority: 321
  # The Sundays of Great Lent, 1st to 5th: the Sunday order with the Triodion
  # (internal/liturgy/triodion_matins.go); «Непорочны» instead of the polyeleos.
  when: triodion_day in ["lent1", "lent2", "lent3", "lent4", "lent5"] && !feast_day
