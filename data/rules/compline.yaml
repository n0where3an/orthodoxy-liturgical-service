# Rules for small compline (малое повечерие), served the evening before the
# liturgical day (like vespers, it is planned for the day it begins).
#
# Implemented: the days of the Octoechos (the ordinary period): the canon of
# the Theotokos of the Octoechos (Типикон, гл. 9), the troparia or kontakia
# of the day after the Trisagion (гл. 52) — internal/liturgy/compline.go.
#
# Great compline (data/templates/great_compline.yaml): the Nativity and the
# Theophany, with the litiya, by the Menaion (the vigil: matins follows);
# Great Lent from its second week to the sixth, Monday to Thursday evenings
# (dated Tuesday to Friday), with the canon of the Theotokos of the Octoechos
# and St Ephrem's prayer.
#
# Not served: on the eve of a vigil (a twelve feast, a saint with a vigil) —
# compline is not sung before the all-night vigil. Recognised but not yet
# implemented: the other days of the Triodion (the first week with St
# Andrew's canon, Holy Week, the Annunciation in Lent), a canon of the
# Menaion sung at compline (forefeasts, a saint's service moved there).

- id: compline.triodion
  service: compline
  priority: 300
  when: period != "ordinary"
  unsupported: "Повечерие в дни Триоди (великое повечерие Великого поста) ещё не реализовано"

- id: compline.great.feast
  service: compline
  priority: 295
  # «Праздник ржства хрстова в кий день ни случится, поется повечерие
  # великое сице» (the Menaion, 25 December; 6 January likewise): «С нами Бог»
  # sung, the feast's troparion instead of «Просвети очи моя», its kontakion
  # instead of «Помилуй нас, Господи»; after «Слава в вышних» the litiya.
  when: (month == 12 && day == 25) || (month == 1 && day == 6)
  template: great_compline
  slots:
    troparia_1: {from: eve, part: gc_troparion}
    troparia_2: {from: eve, part: gc_kontakion}
    litiya: {from: eve, part: gc_litiya}
    aposticha: {from: eve, part: gc_aposticha}
    troparion: {from: eve, part: gc_troparion_thrice}

- {id: compline.loaves.theophany, slot: loaves, service: compline, priority: 50, when: "month == 1 && day == 6", fill: {from: unit, refs: [sl.vespers.loaves_prayer]}}
- {id: compline.loaves.none, slot: loaves, service: compline, priority: 10, when: "true", fill: {from: none}}

- id: compline.great.lent.mon_wed
  service: compline
  priority: 305
  # Monday and Wednesday evenings (dated Tuesday, Thursday): «Просвети очи
  # моя»; Tuesday and Thursday evenings: «Невидимых враг моих».
  when: >-
    period == "lenten-triodion" && pascha_offset >= -40 && pascha_offset <= -9 &&
    (weekday == 2 || weekday == 4) && !(month == 3 && (day == 24 || day == 25)) && !menaion_litiya
  template: great_compline
  slots: &lent_slots
    troparia_1:
      from: unit
      refs: [ch.gcompline.troparion.a.1, common.glory, ch.gcompline.troparion.a.2, common.and_now, ch.gcompline.troparion.a.theotokion]
    troparia_2:
      from: unit
      refs: [ch.gcompline.have_mercy.1, common.glory, ch.gcompline.have_mercy.2, common.and_now, ch.gcompline.have_mercy.3]
    canon: {from: compline_canon}
    lent: {from: unit, refs: [ch.gcompline.title]}

- id: compline.great.lent.tue_thu
  service: compline
  priority: 305
  when: >-
    period == "lenten-triodion" && pascha_offset >= -40 && pascha_offset <= -9 &&
    (weekday == 3 || weekday == 5) && !(month == 3 && (day == 24 || day == 25)) && !menaion_litiya
  template: great_compline
  slots:
    <<: *lent_slots
    troparia_1:
      from: unit
      refs: [ch.gcompline.troparion.b.1, ch.gcompline.troparion.b.verse, ch.gcompline.troparion.b.2, common.glory,
        ch.gcompline.troparion.b.3, common.and_now, ch.gcompline.troparion.b.theotokion]

- id: compline.vigil
  service: compline
  priority: 280
  when: feast_day || menaion_litiya
  unsupported: "Под праздник со всенощным бдением повечерие не совершается"

- id: compline.daily
  service: compline
  priority: 10
  slots:
    canon: {from: compline_canon}
    troparia: {from: compline_troparia}
