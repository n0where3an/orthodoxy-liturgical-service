# Rules for the ninth hour. Higher priority wins. Conditions are CEL over the
# day context: weekday (0 = Sunday), period ("ordinary", "lenten-triodion",
# "pentecostarion"), pascha_offset, bright_week, tone, month, day,
# menaion_troparia, menaion_kontakia.
#
# Implemented so far: ordinary days (Menaion troparion and kontakion).
# Recognised but not yet implemented cases are marked "unsupported".

- id: ninth_hour.bright_week
  service: ninth_hour
  priority: 300
  when: bright_week
  unsupported: "Светлая седмица: вместо часов — пасхальные часы (ещё не реализовано)"

- id: ninth_hour.lenten_weekday
  service: ninth_hour
  priority: 200
  # Weekdays of Great Lent and Holy Week (Monday..Friday), when "Аллилуиа" is sung.
  when: period == "lenten-triodion" && pascha_offset >= -48 && pascha_offset <= -3 && weekday >= 1 && weekday <= 5
  unsupported: "Великопостный девятый час (кафизма, поклоны, молитва Ефрема Сирина) ещё не реализован"

- id: ninth_hour.triodion_day
  service: ninth_hour
  priority: 150
  # Other days of the Triodion periods use Triodion troparia/kontakia.
  when: period != "ordinary"
  unsupported: "Тропари и кондаки Триоди ещё не импортированы"

- id: ninth_hour.sunday
  service: ninth_hour
  priority: 100
  when: weekday == 0
  unsupported: "Воскресный девятый час (тропарь Октоиха по гласу) ещё не реализован"

- id: ninth_hour.ordinary
  service: ninth_hour
  priority: 10
  # Weekday of the Menaion. At the hours the troparia and kontakia of the day
  # are said alternately (1st, 3rd, 6th, 9th hour = positions 1..4); the
  # ninth hour is the 4th. To be checked against the Typikon for days with
  # three or more troparia.
  when: "true"
  slots:
    troparion: {from: menaion, kind: troparion, alternate: 4}
    kontakion: {from: menaion, kind: kontakion, alternate: 4}
