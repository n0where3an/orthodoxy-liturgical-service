# Rules for the hours (1st, 3rd, 6th, 9th). Higher priority wins. Conditions
# are CEL over the day context: weekday (0 = Sunday), period ("ordinary",
# "lenten-triodion", "pentecostarion"), pascha_offset, bright_week, tone,
# month, day, menaion_troparia, menaion_kontakia.
#
# Implemented so far: ordinary days (Menaion troparion and kontakion), Sundays,
# a feast of the Theotokos on Sunday.
# Recognised but not yet implemented cases are marked "unsupported".

- id: hours.bright_week
  services: [first_hour, third_hour, sixth_hour, ninth_hour]
  priority: 300
  when: bright_week
  unsupported: "Светлая седмица: вместо часов — пасхальные часы (ещё не реализовано)"

- id: hours.royal
  services: [first_hour, third_hour, sixth_hour, ninth_hour]
  priority: 310
  # The Royal Hours of the Nativity and the Theophany (the Menaion, 24
  # December, 5 January): on the eve, or on the Friday before when the feast
  # falls on Sunday or Monday (internal/liturgy/royal_hours.go). The hour's
  # own psalms, «Слава» the forefeast's troparion, «И ныне» the hour's
  # theotokion; the stichera with their verses, the prokeimenon, the
  # prophecy, the Apostle and the Gospel; the forefeast's kontakion.
  when: royal_hours != ""
  slots:
    royal_psalms: {from: royal, part: psalms}
    troparion: {from: royal, part: troparion}
    royal_hymns: {from: royal, part: hymns}
    royal_prokeimenon: {from: royal, part: prokeimenon}
    royal_readings: {from: royal, part: readings}
    kontakion: {from: royal, part: kontakion}

- id: hours.lenten_weekday
  services: [first_hour, third_hour, sixth_hour, ninth_hour]
  priority: 200
  # Weekdays of Great Lent and Holy Week (Monday..Friday), when "Аллилуиа" is sung.
  when: period == "lenten-triodion" && pascha_offset >= -48 && pascha_offset <= -3 && weekday >= 1 && weekday <= 5
  unsupported: "Великопостные часы (кафизма, поклоны, молитва Ефрема Сирина) ещё не реализованы"

- id: hours.triodion_day
  services: [first_hour, third_hour, sixth_hour, ninth_hour]
  priority: 150
  # Other days of the Triodion periods use Triodion troparia/kontakia.
  when: period != "ordinary"
  unsupported: "Тропари и кондаки Триоди ещё не импортированы"

- id: hours.theotokos_feast_on_sunday
  services: [first_hour, third_hour, sixth_hour, ninth_hour]
  priority: 125
  # A feast of the Theotokos on Sunday (the Menaion, 09.08, 11.21, 08.15:
  # «на часех тропарь воскрсн: слава, тропарь праздника: и ныне,
  # бгородичен часов. по оче наш: кондак воскрсн. такожде и на всех часех
  # кондаки пременяюще глаголем»): the resurrectional kontakion at the 1st
  # hour, the feast's at the 3rd, and so on (internal/liturgy/sunday_hours.go).
  when: >-
    weekday == 0 && feast_day && period == "ordinary" &&
    feast in ["nativity_of_theotokos", "entry_of_theotokos", "annunciation", "dormition"]
  slots:
    troparion_first: {from: sunday_hours, part: troparion_first}
    troparion: {from: sunday_hours, part: troparion}
    kontakion: {from: sunday_hours, part: kontakion}

- id: hours.feast_day
  services: [first_hour, third_hour, sixth_hour, ninth_hour]
  priority: 120
  # A twelve feast: troparion and kontakion of the feast at every hour (a
  # feast of the Lord on Sunday too; of the Theotokos: above).
  when: feast_day
  slots:
    troparion: {from: feast, part: troparion}
    kontakion: {from: feast, part: kontakion}

- id: hours.afterfeast
  services: [first_hour, third_hour, sixth_hour, ninth_hour]
  priority: 110
  # Afterfeast up to the apodosis: the feast's troparion and kontakion
  # alternate at the hours with those of the saint of the day (feast first).
  # Sundays of the afterfeast: hours.sunday.
  when: feast != "" && weekday != 0
  slots:
    troparion: {from: feast_and_menaion, part: troparion, kind: troparion, alternate_by_hour: true}
    kontakion: {from: feast_and_menaion, part: kontakion, kind: kontakion, alternate_by_hour: true}

- id: hours.sunday
  services: [first_hour, third_hour, sixth_hour, ninth_hour]
  priority: 100
  # Sunday (Типикон, гл. 52; гл. 3–5 for a saint with a sign): the
  # resurrectional troparion, «Слава» the saint's (the feast's in a forefeast
  # or afterfeast, the Fathers' before the Nativity), «И ныне» the theotokion
  # of the hour; the resurrectional kontakion, or the saint's, the feast's,
  # alternating by the hour (internal/liturgy/sunday_hours.go).
  when: weekday == 0 && period == "ordinary"
  slots:
    troparion_first: {from: sunday_hours, part: troparion_first}
    troparion: {from: sunday_hours, part: troparion}
    kontakion: {from: sunday_hours, part: kontakion}

- id: hours.sunday.unsupported
  services: [first_hour, third_hour, sixth_hour, ninth_hour]
  priority: 99
  when: weekday == 0
  unsupported: "Воскресные часы в дни Триоди ещё не реализованы"

- id: hours.ordinary
  services: [first_hour, third_hour, sixth_hour, ninth_hour]
  priority: 10
  # Weekday of the Menaion. Troparia and kontakia of the day are said at the
  # hours alternately (1st, 3rd, 6th, 9th = positions 1..4). To be checked
  # against the Typikon for days with three or more troparia.
  when: "true"
  slots:
    troparion: {from: menaion, kind: troparion, alternate_by_hour: true}
    kontakion: {from: menaion, kind: kontakion, alternate_by_hour: true}
