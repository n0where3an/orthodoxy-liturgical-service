# Rules for vespers. Implemented: daily vespers (вседневная) on weekdays of
# the ordinary period, and great vespers from the Menaion's own service:
# polyeleos (entrance, readings), vigil (with the litiya and the blessing of
# loaves) — of a saint or of a fixed twelve feast. Doxology-rank services
# have daily vespers with the Menaion's stichera. Sunday great vespers
# (Octoechos) with a saint without a sign. Sundays with a feast, an
# afterfeast or a saint with a sign, the Triodion and the movable feasts are
# recognised and reported as not implemented yet.

- id: vespers.sunday
  service: vespers
  priority: 300
  # Saturday evening, all-night vigil (parish practice: without the litiya
  # and the blessing of loaves): the Octoechos with a saint without a sign.
  when: weekday == 0 && period == "ordinary" && feast == "" && !menaion_great_vespers
  template: great_vespers
  slots:
    title: {from: unit, refs: [ch.vigil.title]}
    vigil: {from: unit, refs: [lit.vigil.arise]}
    kathisma: {from: unit, refs: [ps.kathisma.1.1]}
    lord_i_call: {from: sv_lic}
    lord_i_call_glory_now: {from: sv_glory_now}
    prokeimenon: {from: unit, refs: [ch.vespers.prokeimenon.sun]}
    prokeimenon_verse: {from: sv_prokeimenon_verses}
    paremias: {from: none}
    aposticha: {from: sv_aposticha}
    troparia: {from: gv_troparia, part: theotokos}

- id: vespers.sunday.unsupported
  service: vespers
  priority: 299
  when: weekday == 0
  unsupported: "Воскресная вечерня с праздником, попразднством, святым со знаком или в дни Триоди ещё не реализована"

- id: vespers.triodion
  service: vespers
  priority: 250
  when: period != "ordinary"
  unsupported: "Вечерня в дни Триоди ещё не реализована"

- id: vespers.nativity_theophany
  service: vespers
  priority: 220
  when: (month == 12 && day == 25) || (month == 1 && day == 6)
  unsupported: "Вечерня Рождества Христова и Богоявления (соединённая с литургией свт. Василия Великого, Царские часы) ещё не реализована"

- id: vespers.vigil.lord_feast_on_sunday
  service: vespers
  priority: 310
  # A feast of the Lord on Saturday evening: the feast's service only (the
  # Sunday hymns are not sung). Feasts of the Theotokos on Sunday combine
  # with the resurrection — not implemented yet (vespers.sunday).
  when: weekday == 0 && feast_day && feast in ["exaltation", "meeting", "transfiguration"] && menaion_litiya && menaion_paremias
  template: great_vespers
  slots:
    title: {from: unit, refs: [ch.vigil.title]}
    vigil: {from: unit, refs: [lit.vigil.arise]}
    kathisma: {from: unit, refs: [ps.kathisma.1.1]}
    lord_i_call: {from: gv_lic}
    lord_i_call_glory_now: {from: gv_glory_now, section: lic}
    prokeimenon: {from: unit, refs: [ch.vespers.prokeimenon.sun]}
    prokeimenon_verse: {from: unit, refs: [ch.vespers.prokeimenon.sun.verse]}
    paremias: {from: gv_paremias}
    litiya: {from: gv_litiya}
    aposticha: {from: gv_aposticha}
    troparia: {from: gv_troparia, part: feast}
    loaves: {from: unit, refs: [sl.vespers.loaves_prayer]}

- id: vespers.vigil.feast
  service: vespers
  priority: 210
  # A fixed twelve feast: all-night vigil from the Menaion.
  when: feast_day && menaion_litiya && menaion_paremias
  template: great_vespers
  slots:
    title: {from: unit, refs: [ch.vigil.title]}
    vigil: {from: unit, refs: [lit.vigil.arise]}
    kathisma: {from: unit, refs: [ps.kathisma.1.1]}
    lord_i_call: {from: gv_lic}
    lord_i_call_glory_now: {from: gv_glory_now, section: lic}
    prokeimenon: {from: unit, refs: ["ch.vespers.prokeimenon.{day}"]}
    prokeimenon_verse: {from: unit, refs: ["ch.vespers.prokeimenon.{day}.verse"]}
    paremias: {from: gv_paremias}
    litiya: {from: gv_litiya}
    aposticha: {from: gv_aposticha}
    troparia: {from: gv_troparia, part: feast}
    loaves: {from: unit, refs: [sl.vespers.loaves_prayer]}

- id: vespers.feast_day
  service: vespers
  priority: 200
  when: feast_day
  unsupported: "Великая вечерня этого праздника (переходящего или без службы в Минее) ещё не реализована"

- id: vespers.vigil
  service: vespers
  priority: 160
  # The Menaion service has a litiya: all-night vigil.
  when: menaion_litiya && menaion_paremias
  template: great_vespers
  slots:
    title: {from: unit, refs: [ch.vigil.title]}
    vigil: {from: unit, refs: [lit.vigil.arise]}
    kathisma: {from: unit, refs: [ps.kathisma.1.1]}
    lord_i_call: {from: gv_lic}
    lord_i_call_glory_now: {from: gv_glory_now, section: lic}
    prokeimenon: {from: unit, refs: ["ch.vespers.prokeimenon.{day}"]}
    prokeimenon_verse: {from: unit, refs: ["ch.vespers.prokeimenon.{day}.verse"]}
    paremias: {from: gv_paremias}
    litiya: {from: gv_litiya}
    aposticha: {from: gv_aposticha}
    troparia: {from: gv_troparia, part: vigil}
    loaves: {from: unit, refs: [sl.vespers.loaves_prayer]}

- id: vespers.polyeleos
  service: vespers
  priority: 155
  # Entrance and readings without a litiya: great vespers (polyeleos).
  when: menaion_paremias
  template: great_vespers
  slots:
    title: {from: unit, refs: [sl.vespers.great_title]}
    plain_beginning: {from: unit, refs: [sl.exclamation.blessed_is_our_god]}
    kathisma: {from: unit, refs: [ps.kathisma.1.1]}
    lord_i_call: {from: gv_lic}
    lord_i_call_glory_now: {from: gv_glory_now, section: lic}
    prokeimenon: {from: unit, refs: ["ch.vespers.prokeimenon.{day}"]}
    prokeimenon_verse: {from: unit, refs: ["ch.vespers.prokeimenon.{day}.verse"]}
    paremias: {from: gv_paremias}
    aposticha: {from: gv_aposticha}
    troparia: {from: gv_troparia}

- id: vespers.great
  service: vespers
  priority: 150
  # A great vespers whose readings the Menaion does not give in full
  # (references to the General Menaion, to another day without them).
  when: menaion_great_vespers
  unsupported: "Великая вечерня: чтения в Минее не приведены (ссылка на Общую Минею или на другой день) — ещё не поддерживается"

- id: vespers.daily
  service: vespers
  priority: 10
  slots:
    lord_i_call: {from: vespers_lic}
    lord_i_call_glory_now: {from: vespers_glory_now, section: lic}
    prokeimenon: {from: unit, refs: ["ch.vespers.prokeimenon.{day}"]}
    prokeimenon_verse: {from: unit, refs: ["ch.vespers.prokeimenon.{day}.verse"]}
    aposticha: {from: vespers_aposticha}
    aposticha_glory_now: {from: vespers_glory_now, section: aposticha}
    troparia: {from: vespers_troparia}

# --- Kathisma at vespers (Устав о Псалтири, Следованная Псалтирь) ---
# The day of vespers is the next day: "в понедельник на вечерни" is the
# vespers of Tuesday. Winter (from the apodosis of the Exaltation to Dec 19,
# and from Jan 15): kathisma 18 every weekday evening. Otherwise the
# ordinary order: Mon 6, Tue 9, Wed 12, Thu 15, Fri 18 (evenings).
# On Sunday evening the Psalter is not read.

- id: vespers.kathisma.sunday_evening
  slot: kathisma
  service: vespers
  priority: 100
  when: weekday == 1
  fill: {from: none}
- id: vespers.kathisma.winter
  slot: kathisma
  service: vespers
  priority: 90
  when: >-
    weekday >= 2 && (
      (eve_month == 9 && eve_day >= 22) || eve_month == 10 || eve_month == 11 ||
      (eve_month == 12 && eve_day <= 19) || (eve_month == 1 && eve_day >= 15) || eve_month == 2)
  fill: {from: unit, refs: [ps.kathisma.18.1, ps.kathisma.18.2, ps.kathisma.18.3]}
- id: vespers.kathisma.tue
  slot: kathisma
  service: vespers
  priority: 50
  when: weekday == 2
  fill: {from: unit, refs: [ps.kathisma.6.1, ps.kathisma.6.2, ps.kathisma.6.3]}
- id: vespers.kathisma.wed
  slot: kathisma
  service: vespers
  priority: 50
  when: weekday == 3
  fill: {from: unit, refs: [ps.kathisma.9.1, ps.kathisma.9.2, ps.kathisma.9.3]}
- id: vespers.kathisma.thu
  slot: kathisma
  service: vespers
  priority: 50
  when: weekday == 4
  fill: {from: unit, refs: [ps.kathisma.12.1, ps.kathisma.12.2, ps.kathisma.12.3]}
- id: vespers.kathisma.fri
  slot: kathisma
  service: vespers
  priority: 50
  when: weekday == 5
  fill: {from: unit, refs: [ps.kathisma.15.1, ps.kathisma.15.2, ps.kathisma.15.3]}
- id: vespers.kathisma.sat
  slot: kathisma
  service: vespers
  priority: 50
  when: weekday == 6
  fill: {from: unit, refs: [ps.kathisma.18.1, ps.kathisma.18.2, ps.kathisma.18.3]}
