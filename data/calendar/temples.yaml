# Посвящения храмов — варианты параметра -temple (в честь кого освящён храм,
# в котором совершается служба). kind: lord (Господский), theotokos
# (Богородичный), saint (святому; также бесплотным силам). date: день
# престольного праздника (юлианский MM-DD). troparion/kontakion: ключи
# текстов храма (поются по входе на литургии).
#
# Кроме этого списка, -temple принимает день Минеи: me.MM.DD (или
# me.MM.DDp — вторая служба дня): тропарь и кондак — первые этого дня.

temples:
  # --- Господские ---
  - {id: nativity, title: Рождества Христова, kind: lord, date: "12-25", troparion: me.12.25.troparion.1, kontakion: me.12.25.kontakion.1}
  - {id: theophany, title: Богоявления (Крещения Господня), kind: lord, date: "01-06", troparion: me.01.06.troparion.3, kontakion: me.01.06.kontakion.1}
  - {id: meeting, title: Сретения Господня, kind: lord, date: "02-02", troparion: me.02.02.troparion.1, kontakion: me.02.02.kontakion.1}
  - {id: transfiguration, title: Преображения Господня, kind: lord, date: "08-06", troparion: me.08.06.troparion.1, kontakion: me.08.06.kontakion.1}
  - {id: exaltation, title: Воздвижения Креста Господня, kind: lord, date: "09-14", troparion: me.09.14.troparion.1, kontakion: me.09.14.kontakion.1}
  - {id: holy_mandylion, title: Нерукотворного Образа Спасителя, kind: lord, date: "08-16", troparion: me.08.16.troparion.1, kontakion: me.08.16.kontakion.2}

  # --- Богородичные ---
  - {id: nativity_of_theotokos, title: Рождества Пресвятой Богородицы, kind: theotokos, date: "09-08", troparion: me.09.08.troparion.1, kontakion: me.09.08.kontakion.1}
  - {id: entry_of_theotokos, title: Введения во храм Пресвятой Богородицы, kind: theotokos, date: "11-21", troparion: me.11.21.troparion.1, kontakion: me.11.21.kontakion.1}
  - {id: annunciation, title: Благовещения Пресвятой Богородицы, kind: theotokos, date: "03-25", troparion: me.03.25.troparion.1, kontakion: me.03.25.kontakion.1}
  - {id: dormition, title: Успения Пресвятой Богородицы, kind: theotokos, date: "08-15", troparion: me.08.15.troparion.1, kontakion: me.08.15.kontakion.1}
  - {id: protection, title: Покрова Пресвятой Богородицы, kind: theotokos, date: "10-01", troparion: me.10.01.troparion.3, kontakion: me.10.01.kontakion.3}
  - {id: kazan_icon, title: Казанской иконы Божией Матери, kind: theotokos, date: "10-22", troparion: me.10.22.troparion.2, kontakion: me.10.22.kontakion.3}

