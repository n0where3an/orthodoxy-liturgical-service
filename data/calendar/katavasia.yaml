# Катавасия воскресной утрени по времени года (обычный год). Поётся ирмос
# указанного канона (Минея, первый канон праздника) по 3-й, 6-й, 8-й и 9-й
# песнях. Вне перечисленных сроков — «Отверзу уста моя» (default): ирмосы
# Благовещенского «Отверзу» по второму канону 25 марта (Собор Гавриила,
# 26 марта), 4-я песнь «Седяй в славе» — по первому канону Благовещения.
# Если какого-то ирмоса нет в корпусе, поётся соответствующий из default.
#
# Сроки — по приходской практике; проверить и при необходимости поправить.

default:
  1: me.03.26.matins.canon.2.ode.1.irmos
  3: me.03.26.matins.canon.2.ode.3.irmos
  4: me.03.25.matins.canon.1.ode.4.irmos
  5: me.03.26.matins.canon.2.ode.5.irmos
  6: me.03.26.matins.canon.2.ode.6.irmos
  7: me.03.26.matins.canon.2.ode.7.irmos
  8: me.03.26.matins.canon.2.ode.8.irmos
  9: me.03.26.matins.canon.2.ode.9.irmos

periods:
  - {from: "08-01", to: "08-05", canon: me.09.14.matins.canon.1, title: "Крест начертав"}
  - {from: "08-06", to: "08-14", canon: me.08.06.matins.canon.1, title: "Лицы израилстии"}
  - {from: "08-15", to: "08-23", canon: me.08.15.matins.canon.1, title: "Преукрашенная"}
  - {from: "09-14", to: "09-21", canon: me.09.14.matins.canon.1, title: "Крест начертав"}
  - {from: "11-21", to: "12-31", canon: me.12.25.matins.canon.1, title: "Христос раждается"}
  - {from: "01-01", to: "01-14", canon: me.01.06.matins.canon.1, title: "Глубины открыл"}
  - {from: "02-02", to: "02-09", canon: me.02.02.matins.canon.1, title: "Сушу глубородную"}
